<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="changePass.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <div class="header">
            <p>CHANGE PASSWORD</p>
        </div>
        <div class="formInput">
            <form id="inputForm">
                    <label for="currentPass">CURRENT PASSWORD</label>
                    <input type="password" id="currentPass" name="currentPass">
                    <label for="newPass">NEW PASSWORD</label>
                    <input type="password" id="newPass" name="newPass">

                
                <div>
                    <ul>
                        <li id="uppercase" class="invalid">
                            <i class="fa-solid fa-check"></i>
                            <i class="fa-solid fa-xmark"></i>
                            Password Contain Atleast One UpperCase
                        </li>
                        <li id="lowercase" class="invalid">
                            <i class="fa-solid fa-check"></i>
                            <i class="fa-solid fa-xmark"></i>
                             Password Contain Atleast One LowerCase
                        </li>
                        <li id="hasNumber" class="invalid">
                            <i class="fa-solid fa-check"></i>
                            <i class="fa-solid fa-xmark"></i>
                            Password Contain Atleast One Number
                        </li>
                        <li id="specialChar" class="invalid">
                            <i class="fa-solid fa-check"></i>
                            <i class="fa-solid fa-xmark"></i>
                            Password Contain Atleast 1 Special Character
                        </li>
                        <li id="length" class="invalid">
                            <i class="fa-solid fa-check"></i>
                            <i class="fa-solid fa-xmark"></i>
                            Password Contain Atleast 10 Character
                        </li>
                    </ul> 
                </div>
                <div class="submitBtn">
                    <button type="submit" id="changePassBtn">CHANGE PASSWORD</button>
                </div>

            </form>
             
        </div>
    </div>
    <script src="changePass.js"></script>
</body>
</html>
