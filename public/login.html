<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    .container { width: 300px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px #aaa; }
    h2 { text-align: center; }
    input[type=text], input[type=password] {
      width: 92.5%;max-width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;
    }
    
    button {
      width: 100%; padding: 10px; background: #007BFF; color: #fff; border: none; border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .link { text-align: center; margin-top: 10px; }
    .notification{
      /* display: none; */
    }
    .notification.active{
      height: 1.8rem;
      background-image: linear-gradient(to right,rgb(245, 138, 138) 50%,rgb(231, 216, 216));
      color: rgb(250, 4, 4);
      border-left: 5px solid red;
    }
    .inputPassword{
      position: relative;
    }
    .inputPassword i{
      position: absolute;
      top: 1.25rem;
      right: 1rem;
      cursor: pointer;
    }
    #visiblePass{
      display: block;
    }
    #hidden{
      display: none;
    }
    .invalid{
      color: red;
    }
    .notification p{
      padding-left: 0.6rem;
      padding-top: 0.3rem;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" name="name" placeholder="Username" required>
      <div class="inputPassword">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i id="hidden" class="fa-solid fa-eye-slash"></i>
        <i id="visiblePass" class="fa-solid fa-eye"></i>
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="notification">
      <p id="notify"></p>
    </div>
    <div class="link">
      <p>Don't have an account? <a href="/signup">Sign u  p</a></p>
    </div>
  </div>
  <!-- <script defer src="./main.js"></script>` -->
  <script src="login.js"></script>
</body>
<script>
  const passwordVisibility = document.getElementById("password");
  const showPass = document.querySelector(".fa-eye");
  const hidePass=document.querySelector(".fa-eye-slash");
  const visiblePass = document.getElementById("visiblePass");
  const hidden = document.getElementById("hidden");
  showPass.addEventListener("click",()=>{
    console.log("bye");
    visiblePass.style.display="none";
    hidden.style.display="block";
    passwordVisibility.type="text";
  });
  hidePass.addEventListener("click",()=>{
    visiblePass.style.display="block";
    hidden.style.display="none";
    passwordVisibility.type="password";
  });
</script>
</html>
