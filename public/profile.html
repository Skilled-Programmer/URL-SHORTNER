<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .navBar{
            width: 100%;
            height: 10rem;
            background-color: rgb(230, 214, 214);
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.4rem;
            font-size: 1.4rem;
        }
        .container li{
            list-style:none;
        }
        .container a{
            text-decoration: none;
            color: black;
        }
        .userData{
            width: 100%;
        }
        .userData .container{
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="navBar">
        
        <div class="navBar container">
            <li><a href="/home">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/logout">Logout</a></li>

        </div>
        <div class="userData">
            <div class="userData container">
                <p id="userName"></p>
                <p id="userEmail"></p>
            </div>
        </div>
    </div>
    
</body>
<script>
    async function setData() {
        console.log("helloe trigger");
        const res=await fetch("/myprofile");
        const data=await res.json();
        if(!data.success){
            return window.location.href="/error404";
        }
        const myData=data.myData;
        document.getElementById("userName").textContent=myData.name;
        document.getElementById("userEmail").textContent=myData.email;
    }
    setData();
</script>
</html>
