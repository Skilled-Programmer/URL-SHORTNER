<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update shortcode</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="main">
        <div class="header">Update Shortcode</div>
        <div class="input">
                <form id="updateData">
                    <div>
                       <label for="longLink">LONG LINK</label>
                       <input type="text" name="longLink" id="longLink" placeholder="Update Long Link" required>
                    </div>
                    <div>
                       <label for="shortCode">SHORT CODE</label>
                       <input type="text" name="shortCode" id="shortCode" placeholder="Update Shortcode (Optional)">
                    </div>

                    <div class="btn">
                       <button type="submit" id="getLinks">UPDATE</button>
                    </div>
                </form>
            </div>
    </div>
    <script src="/update.js"></script>
</body>
</html>
