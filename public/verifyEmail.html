<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link rel="stylesheet" href="verifyEmail.css">
</head>
<body>
    <div class="heading">Verify Your Email</div>
    <div class="main">
        <div class="myEmail">
            <p class="addEmail"></p>
        </div>
        <div class="discription">
            <p>Your email has not been verified yet.Please verify your email by entering the 8-digit code or request a new verification link.</p>
        </div>
        <div class="resendBtn">
            <button id="verifyNow">Verify Now</button>
        </div>
    </div>
    <div class="otpSection">
        <input type="number" id="getOtp" name="otp" placeholder="Enter 8-Digit Verification Code">
        <div class="otpBtn">
            <button>Verify Code</button>
        </div>
    </div>
    <script src="verifyEmail.js"></script>
</body>
</html>
